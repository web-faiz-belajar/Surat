
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffb6d5">
    <title>Untuk Seseorang ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hearts" id="hearts"></div>

    <main class="container">
        <div class="heart-icon">💗</div>

        <p class="small-text">SEBUAH PESAN UNTUKMU</p>

        <h1>Hai!! ❤️</h1>

        <p class="description">
            Ada sesuatu yang ingin aku sampaikan kepadamu...
        </p>

        <div class="card">
            <h2>Untuk seseorang yang spesial</h2>

            <p id="typing"></p>

            <button id="openBtn">
                Buka Pesan Spesial 💌
            </button>

            <div id="secret" class="secret hidden">
                <h2>Terima Kasih ❤️</h2>
                <p>
                    Terima kasih sudah hadir dalam cerita hidupku.
                    Semogaa kita bisa bersama sampe selamanya 
                </p>
                <div class="big-heart">💖</div>
            </div>
        </div>

        <p class="footer">
            Dibuat dengan sepenuh hati ❤️
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
